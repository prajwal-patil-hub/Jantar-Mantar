# Analyzer + lint configuration. `flutter analyze` must be green before every
# commit (SECURITY.md release gate). riverpod_lint runs via custom_lint:
# `dart run custom_lint`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # drift_dev output — historical schema snapshots for the migration tests.
    # Regenerated verbatim by `drift_dev schema generate`, so hand-fixing lint
    # findings there would be undone on every schema change.
    - test/core/db/generated_migrations/**
  plugins:
    - custom_lint
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    unawaited_futures: true
    directives_ordering: true
    prefer_final_locals: true
