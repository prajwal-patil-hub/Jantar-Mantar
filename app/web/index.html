<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by the value of `flutter build --base-href`. Must start and end
    with a slash. GitHub Pages serves this project under /Jantar-Mantar/.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    REQUIRED, and its absence was a real bug (ADR-37).

    With no viewport tag, mobile Safari falls back to a 980 px layout viewport
    and scales the whole page down. Measured on an iPhone 13 (390 css px):
    the app laid out at 980 px, so every responsive breakpoint in the Flutter
    code was evaluated against a viewport the device does not have.

    Worse, without `user-scalable=no` a pinch is a BROWSER page-zoom rather
    than a map gesture, so pinching to zoom the map instead rescaled the
    Flutter canvas — which is what "the map disappears when I zoom" was.

    `maximum-scale`/`user-scalable` suppress browser zoom only; they do not
    reduce accessibility here, because the app honours the OS text-size
    setting through MediaQuery.textScaler and the map has its own zoom.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!--
    Content-Security-Policy as a meta tag because GitHub Pages cannot set
    response headers. Weaker than a real header (no frame-ancestors, which
    meta CSP ignores) but it still constrains what a successful injection
    could reach.

    `connect-src` is the important one: it pins network egress to the tile
    server and this project's own Supabase project, so injected script cannot
    quietly ship data to a third-party host. Keep it in step with
    SupabaseConfig.url and MapConfig.urlTemplate — a test asserts they match.

    'wasm-unsafe-eval' is required: Flutter web runs CanvasKit and the drift
    SQLite worker as WebAssembly. 'unsafe-inline' for styles is Flutter's own
    generated styling, not ours to remove.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval';
    worker-src 'self' blob:;
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: blob: https://tile.openstreetmap.org;
    connect-src 'self' data: https://tile.openstreetmap.org https://orsqjucexvrefmexztay.supabase.co wss://orsqjucexvrefmexztay.supabase.co;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'none';
    object-src 'none'">

  <!-- Referrer: never leak this app's URL to the tile server or anywhere else. -->
  <meta name="referrer" content="no-referrer">

  <meta name="description"
        content="CommonGround — an offline-first map of water, food, shelter, medical and safety points, with crowdsourced updates verified before they are shown.">
  <meta name="theme-color" content="#EFE3D4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#160F0A" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CommonGround">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CommonGround</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
