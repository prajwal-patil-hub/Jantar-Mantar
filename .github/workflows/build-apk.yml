name: Build Android APK

# Produces an installable APK. Run it by hand from the Actions tab, or push a
# tag like v0.1.0 to also attach the APKs to a GitHub Release — which is the
# only download link that survives, since workflow artifacts expire.
#
# Signing: if the four ANDROID_KEYSTORE_* secrets are set, the APK is signed
# with your real release key. If they are not, it falls back to the debug key
# and the job says so loudly. A debug-signed APK installs fine for testing but
# cannot be upgraded in place by a properly signed build later — Android
# refuses, and the user has to uninstall and lose their local data.

on:
  workflow_dispatch:
    inputs:
      split_per_abi:
        description: 'Split by CPU (smaller downloads; arm64-v8a suits almost every modern phone)'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Written from secrets, never committed. The `if` means a fork or a
      # first run without secrets still produces something installable.
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — falling back to the DEBUG key. Fine for testing; cannot be upgraded in place later."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/android/release.jks
          cat > app/android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore configured."

      # Same gates as every other build. An APK that ships a known-broken
      # build is worse than no APK, because it gets installed and trusted.
      - name: Verify before packaging
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        working-directory: app
        run: |
          SPLIT=""
          if [ "${{ inputs.split_per_abi }}" != "false" ]; then SPLIT="--split-per-abi"; fi
          flutter build apk --release $SPLIT \
            --dart-define=BUILD_COMMIT="$(git rev-parse --short HEAD)" \
            --dart-define=BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"

      # The bug this catches: Flutter's template declares INTERNET only in the
      # DEBUG manifest. A release APK without it has no network at all, and
      # this app fails silently when that happens — the offline banner appears
      # and everything looks like it is working as designed.
      - name: Verify the APK can actually reach the network
        working-directory: app
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          APK="$(find build/app/outputs/flutter-apk -name '*.apk' | head -1)"
          echo "Inspecting $APK"
          "$AAPT" dump permissions "$APK" > /tmp/perms.txt
          cat /tmp/perms.txt
          grep -q 'android.permission.INTERNET' /tmp/perms.txt \
            || { echo "::error::Release APK has no INTERNET permission — it would silently look permanently offline."; exit 1; }

      - name: Report
        working-directory: app
        run: |
          {
            echo "### APK built"
            echo ""
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "Signed with the **release** key."
            else
              echo "⚠️ Signed with the **debug** key — testing only. It cannot be upgraded in place by a properly signed build later."
            fi
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` — this should match the build stamp at the bottom of Profile."
            echo ""
            echo '| File | Size |'
            echo '|---|---|'
            for f in build/app/outputs/flutter-apk/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Most phones need the **arm64-v8a** one."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: commonground-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # Artifacts expire and require a GitHub login to download. A Release
      # asset is a plain link you can open on a phone.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
