name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Riverpod lints
        run: dart run custom_lint

      - name: Test
        run: flutter test

  # RLS is the only thing standing between an outsider and a group's messages,
  # so the negative tests gate every PR rather than being a pre-release ritual.
  # Verified to fail (exit 1) when a policy is weakened, not just to pass.
  rls-negative-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # pgTAP must live in the SERVER, not just on the runner — the extension
      # is loaded by the database, not by psql.
      - name: Install pgTAP into the postgres service
        run: |
          container=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')
          docker exec "$container" bash -c \
            'apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap'

      - name: Run RLS negative tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/run_local.sh
